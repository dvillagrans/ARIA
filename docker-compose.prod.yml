services:
  fastapi:
    # Resolved from .env (ARIA_IMAGE), e.g. ghcr.io/<owner>/<image>:latest.
    # If ARIA_IMAGE is unset the fallback expects a locally built image.
    image: ${ARIA_IMAGE:-aria-backend:local}
    container_name: aria-fastapi
    env_file: .env
    expose:
      - "8000"
    labels:
      - "proxy.aliases=aria-api"
      - "proxy.network=aria_backend"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend:
    name: aria_backend
    driver: bridge
